<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldView Heatmap</title>
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { font-family: Inter, Segoe UI, sans-serif; background: #0b1020; color: #eff4ff; }
    .layout { display: grid; grid-template-columns: 1fr 360px; height: 100%; }
    .map-wrap { position: relative; padding: 8px; }
    .panel { background: #121a31; border-left: 1px solid rgba(255,255,255,.12); padding: 14px; overflow: auto; }
    .card { border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 10px; margin-top: 10px; background: #0e1529; }
    .hint { position: absolute; left: 16px; top: 16px; background: rgba(10,15,30,.85); padding: 8px 10px; border-radius: 8px; border:1px solid rgba(255,255,255,.15); }
    .row { display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://unpkg.com/react-simple-maps@3.0.0/dist/react-simple-maps.min.js"></script>

  <script type="text/babel">
    const { ComposableMap, Geographies, Geography } = ReactSimpleMaps;
    const GEO_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';

    const countryAlias = {
      USA: 'United States of America',
      UK: 'United Kingdom',
      Belgium: 'Belgium',
      Australia: 'Australia',
      Qatar: 'Qatar',
      Germany: 'Germany',
      'USA/UK': 'United States of America'
    };

    function parseCSV(text) {
      const rows = [];
      let cur = '';
      let row = [];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          row.push(cur); cur = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(cur);
          if (row.some(v => v.trim())) rows.push(row);
          row = []; cur = '';
        } else cur += ch;
      }
      if (cur || row.length) { row.push(cur); rows.push(row); }
      const headers = rows.shift().map(h => h.trim());
      return rows.map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] || '').trim()])));
    }

    function App() {
      const [data, setData] = React.useState({});
      const [hover, setHover] = React.useState('Hover a country');

      React.useEffect(() => {
        fetch('table.csv').then(r => r.text()).then(text => {
          const records = parseCSV(text);
          const grouped = {};
          records.forEach((r) => {
            const raw = r['countries Of Organisation'] || '';
            const key = countryAlias[raw] || raw;
            if (!key) return;
            if (!grouped[key]) grouped[key] = { journalists: 0, rows: [] };
            grouped[key].journalists += 1;
            grouped[key].rows.push(r);
          });
          setData(grouped);
        });
      }, []);

      const max = Math.max(1, ...Object.values(data).map(v => v.journalists || 0));
      const color = (count) => {
        if (!count) return '#1f2b45';
        const t = count / max;
        if (t > 0.8) return '#ff315f';
        if (t > 0.6) return '#ff7a59';
        if (t > 0.4) return '#ffc857';
        if (t > 0.2) return '#8ce99a';
        return '#51cf66';
      };

      const topCountries = Object.entries(data).sort((a,b)=>b[1].journalists-a[1].journalists).slice(0,8);

      return (
        <div className="layout">
          <div className="map-wrap">
            <div className="hint">Heatmap by journalist concentration</div>
            <ComposableMap projectionConfig={{ scale: 150 }} style={{ width: '100%', height: '100%' }}>
              <Geographies geography={GEO_URL}>
                {({ geographies }) => geographies.map((geo) => {
                  const name = geo.properties.name;
                  const count = data[name]?.journalists || 0;
                  return (
                    <Geography
                      key={geo.rsmKey}
                      geography={geo}
                      onMouseEnter={() => setHover(`${name}: ${count} journalist(s)`)}
                      onMouseLeave={() => setHover('Hover a country')}
                      style={{
                        default: { fill: color(count), stroke: '#5f6b85', strokeWidth: 0.4, outline: 'none' },
                        hover: { fill: '#f783ac', stroke: '#fff', strokeWidth: 0.6, outline: 'none' },
                        pressed: { fill: '#faa2c1', outline: 'none' }
                      }}
                    />
                  );
                })}
              </Geographies>
            </ComposableMap>
          </div>
          <aside className="panel">
            <h2>Journalist Heatmap</h2>
            <p>{hover}</p>
            <div className="card">
              <b>Highest concentration</b>
              {topCountries.map(([name, info]) => (
                <div className="row" key={name}><span>{name}</span><span>{info.journalists}</span></div>
              ))}
            </div>
            <div className="card">
              <a href="admin.html" style={{color:'#8ec5ff'}}>Go to admin upload</a>
            </div>
          </aside>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
