<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldView Interactive Map</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: radial-gradient(circle at top, #1f2a54 0%, #0c1023 45%, #090b14 100%);
        --card: rgba(255, 255, 255, 0.1);
        --stroke: rgba(255, 255, 255, 0.35);
        --text: #f8f9ff;
        --muted: #cad2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }

      h1 {
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        margin-bottom: 0.35rem;
      }

      .subtitle {
        color: var(--muted);
        margin-top: 0;
      }

      .layout {
        display: grid;
        gap: 1.2rem;
        grid-template-columns: minmax(300px, 2fr) minmax(280px, 1fr);
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        padding: 1rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      #map {
        width: 100%;
        height: auto;
      }

      .region {
        stroke: rgba(255, 255, 255, 0.55);
        stroke-width: 1.5;
        cursor: pointer;
        transition: transform 150ms ease, filter 150ms ease, stroke-width 150ms ease;
      }

      .region:hover,
      .region:focus-visible {
        transform: translateY(-2px);
        filter: brightness(1.15);
        stroke-width: 2.2;
        outline: none;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin: 0.4rem 0 1rem;
      }

      input[type="color"] {
        inline-size: 60px;
        block-size: 40px;
        border: none;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
      }

      #infoTitle {
        margin-top: 0;
      }

      #infoText {
        color: var(--muted);
      }

      .gallery {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.8rem;
      }

      .gallery li {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 0.75rem;
        align-items: center;
        padding: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
      }

      .gallery img {
        width: 96px;
        height: 72px;
        object-fit: cover;
        border-radius: 10px;
      }

      .gallery p {
        margin: 0;
        font-size: 0.9rem;
      }

      @media (max-width: 920px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>WorldView Explorer</h1>
      <p class="subtitle">Paint each region and hover to reveal picture highlights + quick facts.</p>

      <section class="layout">
        <div class="panel">
          <label class="controls">
            <span>Choose a paint color:</span>
            <input type="color" id="paintColor" value="#55e3ff" aria-label="Choose region color" />
          </label>

          <svg id="map" viewBox="0 0 900 460" aria-label="Interactive world regions map">
            <path id="north-america" tabindex="0" class="region" fill="#5873ff" d="M75,122 L180,86 L250,95 L300,120 L275,168 L210,180 L175,220 L120,210 L88,170 Z" />
            <path id="south-america" tabindex="0" class="region" fill="#ff7c9b" d="M210,235 L265,245 L300,290 L278,360 L238,410 L190,340 L180,285 Z" />
            <path id="europe" tabindex="0" class="region" fill="#65d7ab" d="M390,110 L450,98 L510,120 L488,156 L436,170 L396,145 Z" />
            <path id="africa" tabindex="0" class="region" fill="#ffd166" d="M410,184 L488,185 L538,250 L520,365 L438,380 L392,300 Z" />
            <path id="asia" tabindex="0" class="region" fill="#a78bfa" d="M525,100 L700,90 L800,140 L818,220 L730,250 L630,230 L560,180 Z" />
            <path id="oceania" tabindex="0" class="region" fill="#00c2ff" d="M690,300 L785,292 L840,340 L805,392 L705,385 L672,336 Z" />
          </svg>
        </div>

        <aside class="panel" aria-live="polite">
          <h2 id="infoTitle">Hover a region</h2>
          <p id="infoText">You will see a short description and a mini gallery here.</p>
          <ul id="gallery" class="gallery"></ul>
        </aside>
      </section>
    </main>

    <script>
      const data = {
        "north-america": {
          name: "North America",
          info: "A mix of snowy peaks, large cities, and iconic national parks.",
          images: [
            { src: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80", caption: "Canadian Rockies" },
            { src: "https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=600&q=80", caption: "City lights in the U.S." }
          ]
        },
        "south-america": {
          name: "South America",
          info: "Rainforests, dramatic coasts, and vibrant cultural festivals.",
          images: [
            { src: "https://images.unsplash.com/photo-1505764706515-aa95265c5abc?auto=format&fit=crop&w=600&q=80", caption: "Andes mountain landscape" },
            { src: "https://images.unsplash.com/photo-1544989164-31b3d1f4f383?auto=format&fit=crop&w=600&q=80", caption: "Colorful neighborhood streets" }
          ]
        },
        europe: {
          name: "Europe",
          info: "Historic architecture, world museums, and storybook towns.",
          images: [
            { src: "https://images.unsplash.com/photo-1471623320832-752e8bbf8413?auto=format&fit=crop&w=600&q=80", caption: "Old town skyline" },
            { src: "https://images.unsplash.com/photo-1431274172761-fca41d930114?auto=format&fit=crop&w=600&q=80", caption: "Alpine railway views" }
          ]
        },
        africa: {
          name: "Africa",
          info: "Expansive savannas, deserts, and rich biodiversity.",
          images: [
            { src: "https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=600&q=80", caption: "Safari sunset" },
            { src: "https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?auto=format&fit=crop&w=600&q=80", caption: "Dune adventure" }
          ]
        },
        asia: {
          name: "Asia",
          info: "Ancient traditions alongside cutting-edge megacities.",
          images: [
            { src: "https://images.unsplash.com/photo-1480796927426-f609979314bd?auto=format&fit=crop&w=600&q=80", caption: "Temple landscape" },
            { src: "https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=600&q=80", caption: "Modern skyline at dusk" }
          ]
        },
        oceania: {
          name: "Oceania",
          info: "Coral reefs, island ecosystems, and coastal city life.",
          images: [
            { src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80", caption: "Turquoise island waters" },
            { src: "https://images.unsplash.com/photo-1506973035872-a4ec16b8d6ad?auto=format&fit=crop&w=600&q=80", caption: "Harbor evening" }
          ]
        }
      };

      const colorPicker = document.getElementById("paintColor");
      const infoTitle = document.getElementById("infoTitle");
      const infoText = document.getElementById("infoText");
      const gallery = document.getElementById("gallery");
      const regions = document.querySelectorAll(".region");

      function renderDetails(regionId) {
        const details = data[regionId];
        if (!details) return;

        infoTitle.textContent = details.name;
        infoText.textContent = details.info;
        gallery.innerHTML = details.images
          .map(
            (item) => `
              <li>
                <img src="${item.src}" alt="${item.caption}" loading="lazy" />
                <p>${item.caption}</p>
              </li>`
          )
          .join("");
      }

      regions.forEach((region) => {
        region.addEventListener("mouseenter", () => renderDetails(region.id));
        region.addEventListener("focus", () => renderDetails(region.id));
        region.addEventListener("click", () => {
          region.setAttribute("fill", colorPicker.value);
          renderDetails(region.id);
        });
      });
    </script>
  </body>
</html>
