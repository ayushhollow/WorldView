<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldView Heatmap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: Inter, Segoe UI, sans-serif; }
    .topbar { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; display: flex; justify-content: space-between; gap: 10px; }
    .panel { background: rgba(8,12,28,.88); color: #f2f6ff; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; padding: 10px 12px; max-width: 75%; }
    .actions { display:flex; gap:8px; align-items:flex-start; }
    .btn { background: linear-gradient(120deg,#ffa94d,#ff5d8f); color: #19080f; border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; text-decoration: none; cursor:pointer; }
    .card { position: absolute; bottom: 14px; left: 14px; z-index: 1000; max-width: 430px; max-height: 44vh; overflow: auto; background: rgba(8,12,28,.92); color: #eff4ff; border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 12px; display: none; }
    .person { display: grid; grid-template-columns: 56px 1fr; gap: 8px; margin: 8px 0; padding: 8px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="topbar">
    <div class="panel" id="hoverInfo"><h3>Hover a country</h3><p>Countries are shaded by total article count.</p></div>
    <div class="actions"><button id="refreshBtn" class="btn">Refresh Data</button><a href="admin.html" class="btn">Admin Access</a></div>
  </div>
  <div id="details" class="card"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const WORLD_BOUNDS = L.latLngBounds(L.latLng(-60, -180), L.latLng(85, 180));
    const map = L.map('map', { minZoom: 2, maxZoom: 8, worldCopyJump: false, maxBounds: WORLD_BOUNDS, maxBoundsViscosity: 1 }).setView([20,8],2);
    map.fitBounds(WORLD_BOUNDS);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', noWrap:true, bounds: WORLD_BOUNDS, minZoom:2, maxZoom:8 }).addTo(map);

    const hoverInfo = document.getElementById('hoverInfo');
    const details = document.getElementById('details');
    let geoCache = null;
    let layerRef = null;
    let sharedCountries = {};

    function getCountryData() {
      const local = JSON.parse(localStorage.getItem('worldview_data') || '{}').countries || {};
      return Object.assign({}, sharedCountries, local);
    }

    function resolveData(data, iso, name) {
      return data[iso] || data[name] || data[String(name).toLowerCase()] || null;
    }

    function getColorByVolume(v, max) {
      if (!v || !max) return '#5c668f';
      const t = v / max;
      if (t >= 0.8) return '#ff2d55';
      if (t >= 0.6) return '#ff7a45';
      if (t >= 0.4) return '#ffd166';
      if (t >= 0.2) return '#7ee081';
      return '#43d9bd';
    }

    function render() {
      if (!geoCache) return;
      const data = getCountryData();
      const maxArticles = Math.max(0, ...Object.values(data).map(d => Number(d.articles || 0)));
      if (layerRef) map.removeLayer(layerRef);

      layerRef = L.geoJSON(geoCache, {
        style: f => {
          const d = resolveData(data, f.properties.ISO_A3, f.properties.ADMIN);
          const articles = d ? Number(d.articles || 0) : 0;
          return { color:'#d7e4ff', weight:1, fillColor:getColorByVolume(articles, maxArticles), fillOpacity:d ? 0.72 : 0.15 };
        },
        onEachFeature: (f, l) => {
          const name = f.properties.ADMIN;
          const iso = f.properties.ISO_A3;
          l.on('mouseover', () => {
            l.setStyle({weight:2});
            const d = resolveData(data, iso, name);
            hoverInfo.innerHTML = d
              ? `<h3>${name}</h3><p>Journalists: ${d.journalists_count} • Articles: ${d.articles} • Negative: ${d.negative_articles}</p>`
              : `<h3>${name}</h3><p>No data loaded.</p>`;
          });
          l.on('mouseout', () => layerRef.resetStyle(l));
          l.on('click', e => {
            const d = resolveData(data, iso, name);
            if (!d) { details.style.display='none'; return; }
            details.style.display = 'block';
            details.innerHTML = `<h3>${name} journalists</h3>` + (d.journalists || []).map(j => `<div class='person'><img src='${j.photo || "https://via.placeholder.com/56"}' width='56' height='56'/><div><b>${j.name || 'Unknown'}</b><div>Biases: ${j.biases || 'N/A'}</div><details><summary>Owner details</summary><div>Owner: ${j.owner_name || 'N/A'}</div><div>Organization: ${j.owner_organization || 'N/A'}</div></details></div></div>`).join('');
            L.popup().setLatLng(e.latlng).setContent(`<b>${name}</b><br/>Articles: ${d.articles || 0}`).openOn(map);
          });
        }
      }).addTo(map);
    }

    Promise.all([
      fetch('worldview_data.json').then(r => r.ok ? r.json() : { countries: {} }).catch(() => ({ countries: {} })),
      fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r => r.json())
    ]).then(([shared, geo]) => { sharedCountries = shared.countries || {}; geoCache = geo; render(); });

    document.getElementById('refreshBtn').addEventListener('click', render);
  </script>
</body>
</html>
